name: Build and deploy web installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ESP-IDF firmware
        run: idf.py build

      - name: Package merged web-installer image
        run: python tools/package_web_firmware.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-micro-cardputer-firmware
          path: docs/firmware/codex-micro-cardputer-full.bin
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
